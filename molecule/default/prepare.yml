---
- name: Make sure rsync is installed on the ansible controller
  hosts: localhost
  connection: local
  become: false
  gather_facts: true
  tasks:

    - name: Ensure rsync exists on the controller
      ansible.builtin.package:
        name:
          - rsync
        state: present

- name: Prepare the test image for Converge
  hosts: all
  become: true
  gather_facts: true
  tasks:

    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true

    - name: Ensure dependencies are present in test image
      ansible.builtin.package:
        name:
          - rsync
          - make
          - findutils
          - sudo
        state: present
